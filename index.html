<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Espaço Imperial — Cardápio Digital</title>
  <meta name="description" content="Cardápio digital interativo do Espaço Imperial — Bar & Restaurante. Folheie como um cardápio real.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./src/css/theme.css">
  <link rel="stylesheet" href="./src/css/flipbook.css">
  <link rel="stylesheet" href="./src/css/style.css">
  
  <!-- StPageFlip via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
</head>
<body>
  <!-- Grain texture overlay -->
  <div class="grain"></div>

  <!-- Flipbook Container -->
  <div class="flipbook-wrapper" id="flipbookWrapper">
    <!-- Navigation header (appears on top of flipbook) -->
    <nav class="flip-nav" id="flipNav">
      <div class="flip-nav-inner" id="flipNavInner"></div>
    </nav>

    <!-- The flipbook itself -->
    <div class="flipbook-container" id="flipbook"></div>

    <!-- Page indicator -->
    <div class="page-indicator" id="pageIndicator">
      <span id="currentPage">1</span> / <span id="totalPages">1</span>
    </div>

    <!-- Navigation arrows -->
    <button class="flip-arrow flip-arrow-prev" id="prevBtn" aria-label="Página anterior">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="flip-arrow flip-arrow-next" id="nextBtn" aria-label="Próxima página">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <!-- Product Modal Overlay -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card" id="modalCard">
      <button class="modal-close" id="modalClose" aria-label="Fechar">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="modal-image-wrap" id="modalImageWrap">
        <img class="modal-image" id="modalImage" src="" alt="">
      </div>
      <div class="modal-body">
        <h2 class="modal-title" id="modalTitle"></h2>
        <p class="modal-serves" id="modalServes"></p>
        <p class="modal-desc" id="modalDesc"></p>
        <div class="modal-price-area" id="modalPriceArea"></div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/js/main.js"></script>
</body>
</html>
