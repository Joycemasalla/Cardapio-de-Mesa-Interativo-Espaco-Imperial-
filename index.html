<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Espaço Imperial — Cardápio</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rye&family=Libre+Franklin:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="./src/css/theme.css">
  <link rel="stylesheet" href="./src/css/style.css">
</head>
<body>
  <div class="grain"></div>

  <!-- HEADER -->
  <header class="site-header" id="header">
    <div class="header-content">
      <img class="header-logo" src="/logo.png" alt="Espaço Imperial Logo">
      <div class="header-text">
        <p class="header-eyebrow">BAR & RESTAURANTE</p>
        <h1 class="header-title">Espaço Imperial</h1>
        <p class="header-sub">Cardápio digital da sua mesa — deslize e toque para mais detalhes.</p>
      </div>
    </div>
  </header>

  <!-- STICKY NAV -->
  <nav class="sticky-nav" id="catnav"></nav>

  <!-- MAIN LIST -->
  <main class="main-content" id="mainContent"></main>

  <footer>
    <span class="fw">Espaço Imperial</span>
    Cardápio digital · peça diretamente com a nossa equipe
  </footer>

  <button class="totop" id="totop" aria-label="Voltar ao topo" onclick="window.scrollTo({top:0, behavior:'smooth'})">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 19V5M5 12l7-7 7 7" stroke="#1c1207" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <!-- JS -->
  <script type="module" src="./src/js/main.js"></script>

</html>
